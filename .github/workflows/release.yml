name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hamsoo-addon
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static checks
        run: node scripts/check.js

      - name: Build extension
        run: node build.js

      - name: Run test suite
        run: node test/run.js

      - name: Package extension archives
        run: npm run zip

      - name: Generate release notes
        run: node scripts/release-notes.js > ../RELEASE_NOTES.md

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} exists; updating notes and assets"
            gh release edit "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file ../RELEASE_NOTES.md
            gh release upload "${{ github.ref_name }}" \
              dist/hamsoo-chromium.zip \
              dist/hamsoo-firefox.zip \
              --clobber
          else
            gh release create "${{ github.ref_name }}" \
              dist/hamsoo-chromium.zip \
              dist/hamsoo-firefox.zip \
              --title "${{ github.ref_name }}" \
              --notes-file ../RELEASE_NOTES.md
          fi
